<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">How Berlin Airlift works</title>
  <desc id="d">Step 1: pick a drink in the app. Step 2: hold a blank card to your phone and the app writes it. Step 3: put the card in your Berlin and press its button.</desc>
  <rect width="1200" height="380" rx="28" fill="#F6EFE3"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- step 1: phone with menu -->
    <g transform="translate(70 40)">
      <rect x="70" y="0" width="150" height="230" rx="26" fill="#2A1B12"/>
      <rect x="80" y="12" width="130" height="206" rx="18" fill="#F6EFE3"/>
      <rect x="92" y="34" width="106" height="30" rx="15" fill="#17703D"/><text x="145" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Full Pot</text>
      <rect x="92" y="74" width="106" height="30" rx="15" fill="#EADFCB"/><text x="145" y="94" text-anchor="middle" font-size="13" fill="#2A1B12">Half Pot</text>
      <rect x="92" y="114" width="106" height="30" rx="15" fill="#EADFCB"/><text x="145" y="134" text-anchor="middle" font-size="13" fill="#2A1B12">Light Roast</text>
      <rect x="92" y="154" width="106" height="30" rx="15" fill="#EADFCB"/><text x="145" y="174" text-anchor="middle" font-size="13" fill="#2A1B12">Grind Only</text>
      <circle cx="30" cy="20" r="22" fill="#17703D"/><text x="30" y="28" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
      <text x="145" y="275" text-anchor="middle" font-size="24" font-weight="800" fill="#2A1B12">Pick a drink</text>
      <text x="145" y="305" text-anchor="middle" font-size="17" fill="#6B5444">Full Pot is already picked.</text>
    </g>
    <path d="M378 150 L 428 150" stroke="#C99B66" stroke-width="6" stroke-linecap="round"/><path d="M420 138 L 436 150 L 420 162" stroke="#C99B66" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- step 2: card on phone -->
    <g transform="translate(455 40)">
      <rect x="70" y="0" width="150" height="230" rx="26" fill="#2A1B12"/>
      <rect x="80" y="12" width="130" height="206" rx="18" fill="#F6EFE3"/>
      <rect x="92" y="150" width="106" height="40" rx="20" fill="#17703D"/><text x="145" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Write a card</text>
      <g transform="rotate(-10 150 40)"><rect x="100" y="-20" width="130" height="82" rx="10" fill="#FFFFFF" stroke="#C99B66" stroke-width="3"/><circle cx="200" cy="12" r="12" fill="none" stroke="#17703D" stroke-width="3"/><circle cx="200" cy="12" r="20" fill="none" stroke="#17703D" stroke-width="2" stroke-opacity="0.5"/><text x="120" y="48" font-size="12" fill="#6B5444">blank card</text></g>
      <circle cx="30" cy="20" r="22" fill="#17703D"/><text x="30" y="28" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
      <text x="145" y="275" text-anchor="middle" font-size="24" font-weight="800" fill="#2A1B12">Hold a blank card to it</text>
      <text x="145" y="305" text-anchor="middle" font-size="17" fill="#6B5444">The app writes it and checks it.</text>
    </g>
    <path d="M763 150 L 813 150" stroke="#C99B66" stroke-width="6" stroke-linecap="round"/><path d="M805 138 L 821 150 L 805 162" stroke="#C99B66" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- step 3: machine -->
    <g transform="translate(840 40)">
      <g transform="translate(55 0) scale(1.05)">
        <path d="M40 200 C 20 200, 14 180, 18 150 L 34 70 C 40 40, 60 26, 100 26 C 140 26, 160 40, 166 70 L 182 150 C 186 180, 180 200, 160 200 Z" fill="#C99B66"/>
        <rect x="70" y="52" width="60" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.75"/>
        <circle cx="88" cy="88" r="5" fill="#17703D"/><circle cx="102" cy="94" r="5" fill="#17703D"/><circle cx="114" cy="84" r="5" fill="#17703D"/>
        <rect x="76" y="128" width="48" height="8" rx="4" fill="#5B3A26" fill-opacity="0.55"/>
        <rect x="84" y="108" width="32" height="22" rx="3" fill="#FFFFFF" stroke="#17703D" stroke-width="2"/>
        <circle cx="100" cy="160" r="12" fill="#17703D"/><circle cx="100" cy="160" r="5" fill="#7BE495"/>
      </g>
      <circle cx="30" cy="20" r="22" fill="#17703D"/><text x="30" y="28" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text>
      <text x="160" y="275" text-anchor="middle" font-size="24" font-weight="800" fill="#2A1B12">Put it in your Berlin</text>
      <text x="160" y="305" text-anchor="middle" font-size="17" fill="#6B5444">Press its button. Coffee.</text>
    </g>
  </g>
</svg>
