# Walks every screen of the demo build and takes a picture of each.
# Run by .github/workflows/layout-check.yml on Android emulators and iPhone simulators.
appId: com.berlinairlift.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Write a card"
    timeout: 60000
- takeScreenshot: ${OUT}/01-home
- tapOn: "Write a card"
- extendedWaitUntil:
    visible: ".*card ready.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/02-done
- tapOn: "Write another"
- tapOn: "Change"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/03-drink
- scrollUntilVisible:
    element: "Brew after roasting"
    direction: DOWN
    optional: true
- takeScreenshot: ${OUT}/04-drink-slider
- tapOn: "Done"
- waitForAnimationToEnd
- tapOn: "What's on this card\\?"
- extendedWaitUntil:
    visible: "Copy it to a blank card"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/05-read
- tapOn: "Done"
- waitForAnimationToEnd
- tapOn: "Help"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/06-help
- scroll
- takeScreenshot: ${OUT}/07-help-lower
- tapOn: "Done"
- waitForAnimationToEnd
- tapOn: "More"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/08-more
- scroll
- takeScreenshot: ${OUT}/09-more-lower
- scroll
- takeScreenshot: ${OUT}/10-more-end
